<style>
/* Layout: one-column phone ledger, hero balance on top, fixed bottom tab bar, bottom-sheet forms */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --line:#DCE3E0;
  --ink:#14211E; --muted:#5D6E69; --brass:#9A6F12; --brass-soft:#F4EAD3;
  --hero:#173A33; --hero-ink:#F2F6F4; --hero-muted:#A9C2BB;
  --good:#1E7A4F; --good-soft:#DDF1E6; --warn:#A35F00; --warn-soft:#FBEBD2; --bad:#B3261E; --bad-soft:#F8DEDB;
  --c1:#2F6F62; --c2:#C9A13B; --c3:#5876B8; --c4:#B5654A; --c5:#7A5BA6; --c6:#3E9BB0; --c7:#8A8F3C; --c8:#8E9A97;
  --font:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#16201D; --surface-2:#1C2825; --line:#2A3834;
  --ink:#E4ECE9; --muted:#97A9A4; --brass:#D9AE4E; --brass-soft:#3A2F17;
  --hero:#1D4A40; --hero-ink:#F2F6F4; --hero-muted:#A9C9C0;
  --good:#5CC48D; --good-soft:#173A29; --warn:#E8A44A; --warn-soft:#3D2C14; --bad:#F07C72; --bad-soft:#401C19;
  --c1:#4FA592; --c2:#D9B455; --c3:#7F9BDB; --c4:#D88A6E; --c5:#A887D1; --c6:#5DBCD1; --c7:#B3B85A; --c8:#8E9A97;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201D; --surface-2:#1C2825; --line:#2A3834;
  --ink:#E4ECE9; --muted:#97A9A4; --brass:#D9AE4E; --brass-soft:#3A2F17;
  --hero:#1D4A40; --hero-ink:#F2F6F4; --hero-muted:#A9C9C0;
  --good:#5CC48D; --good-soft:#173A29; --warn:#E8A44A; --warn-soft:#3D2C14; --bad:#F07C72; --bad-soft:#401C19;
  --c1:#4FA592; --c2:#D9B455; --c3:#7F9BDB; --c4:#D88A6E; --c5:#A887D1; --c6:#5DBCD1; --c7:#B3B85A; --c8:#8E9A97;
  color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.2px}
.brand span{font-size:13px;color:var(--muted)}
.store-pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.store-pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.store-pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{font-size:13px;color:var(--hero-muted)}
.hero .big{font-size:clamp(26px,8vw,36px);font-weight:800;line-height:1.2;word-break:break-word}
.hero .big small{font-size:15px;font-weight:500;color:var(--hero-muted);margin-inline-start:6px}
.hero .short{font-size:13px;color:var(--hero-muted)}
.hero-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.hero-grid div{display:flex;flex-direction:column;min-width:0}
.hero-grid span{font-size:12px;color:var(--hero-muted)}
.hero-grid b{font-size:14px;font-weight:700;overflow-wrap:anywhere}

.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.section-head .sub{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:right;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .meta{grid-column:1;font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.row .amt{font-weight:700;text-align:left;white-space:nowrap}
.row .side{grid-column:2;grid-row:2;justify-self:end}
.in{color:var(--good)} .out{color:var(--bad)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.brass{background:var(--brass-soft);color:var(--brass)}
.dir-tag{font-size:11px;font-weight:700;padding:0 7px;border-radius:6px;margin-inline-end:6px;vertical-align:1px}
.dir-tag.in{background:var(--good-soft)} .dir-tag.out{background:var(--bad-soft)}

.alert{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink)}
.alert.bad{background:var(--bad-soft)}
.alert .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);margin-top:7px;flex:none}
.alert.bad .dot{background:var(--bad)}
.alert b{display:block}
.alert span{font-size:13px;color:var(--muted)}

.flow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flow .card{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.flow span{font-size:12px;color:var(--muted)}
.flow b{font-size:17px;overflow-wrap:anywhere}

.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.bar i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px;min-width:0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{color:var(--muted);margin-inline-start:auto;white-space:nowrap}
.alloc{padding:14px;display:flex;flex-direction:column;gap:12px}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--hero);color:var(--hero-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--hero);color:var(--hero-ink);border-color:transparent}
.btn.brass{background:var(--brass-soft);color:var(--brass);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:transparent}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.inline-set{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.inline-set select{font-family:inherit;font-size:13px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.empty{padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:16px}
.note{font-size:13px;color:var(--muted)}
details.archive summary{cursor:pointer;font-size:14px;color:var(--muted);padding:4px 0}
details.archive[open] summary{margin-bottom:8px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr) 56px;gap:4px;align-items:center}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;color:var(--muted);border-radius:10px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{stroke:var(--brass)}
.fab{width:50px;height:50px;border-radius:16px;border:0;background:var(--brass);color:#fff;font-size:28px;line-height:1;display:grid;place-items:center;justify-self:center}

.scrim{position:fixed;inset:0;z-index:30;background:rgba(5,12,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lab{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{font-family:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%;min-width:0}
.field textarea{min-height:64px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.date3{display:grid;grid-template-columns:.8fr 1.4fr 1fr;gap:6px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px;font-weight:600}
.choice button[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-soft);color:var(--brass)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:380px){.hero-grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div id="app" lang="fa" dir="rtl"></div>
<nav class="tabbar" dir="rtl" aria-label="بخش‌ها"><div class="tabbar-in" id="tabs"></div></nav>
<div id="sheet-root"></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="restore-file" accept=".json,application/json" hidden>

function j2g(jy,jm,jd){jy+=1595;var days=-355668+(365*jy)+(~~(jy/33)*8)+~~(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);var gy=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++;}gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365;}var gd=days+1;var s=[0,31,((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];var gm;for(gm=0;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd];}
function jMonthLen(y,m){if(m<=6)return 31;if(m<=11)return 30;var g=j2g(y,12,30),b=g2j(g[0],g[1],g[2]);return (b[0]===y&&b[1]===12)?30:29;}
var MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
var pad=function(n){return String(n).padStart(2,"0")};
function isoFromJ(y,m,d){var g=j2g(y,m,d);return g[0]+"-"+pad(g[1])+"-"+pad(g[2]);}
function jFromIso(iso){var p=iso.split("-").map(Number);return g2j(p[0],p[1],p[2]);}
function todayIso(){var t=new Date();return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate());}
function addDaysIso(iso,n){var p=iso.split("-").map(Number);var d=new Date(p[0],p[1]-1,p[2]+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function daysUntil(iso){var a=iso.split("-").map(Number),b=todayIso().split("-").map(Number);return Math.round((Date.UTC(a[0],a[1]-1,a[2])-Date.UTC(b[0],b[1]-1,b[2]))/86400000);}
function faDate(iso){if(!iso)return "";var j=jFromIso(iso);return fa(j[2])+" "+MONTHS[j[1]-1]+" "+fa(j[0]);}

/* ---------- numbers ---------- */
var NF=new Intl.NumberFormat("fa-IR"),NP=new Intl.NumberFormat("fa-IR",{useGrouping:false});
function fa(n){return NP.format(n)}
function money(n){return NF.format(Math.round(n||0))}
function shortMoney(n){var a=Math.abs(n),s=n<0?"منفی ":"";if(a>=1e9)return s+trim(a/1e9)+" میلیارد تومان";if(a>=1e6)return s+trim(a/1e6)+" میلیون تومان";if(a>=1e3)return s+trim(a/1e3)+" هزار تومان";return s+fa(a)+" تومان";}
function trim(x){return new Intl.NumberFormat("fa-IR",{maximumFractionDigits:x<10?2:1}).format(x)}
function toLatin(s){return String(s||"").replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[٫]/g,".");}
function parseNum(s){var t=toLatin(s).replace(/[,،\u066c\s]/g,"");if(t==="")return null;var n=Number(t);return isFinite(n)?n:null;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}

/* ---------- sync: encrypted secret gist on GitHub ---------- */
var Sync=(function(){
  var CFG_KEY="daftar-sync-v1",FILE="daftar-sarmayeh.enc.json",API="https://api.github.com";
  var cfg=null,timer=null,busy=false,again=false;
  var st={state:"off",at:null,msg:""};
  try{cfg=JSON.parse(localStorage.getItem(CFG_KEY)||"null")}catch(e){}
  function saveCfg(){try{if(cfg)localStorage.setItem(CFG_KEY,JSON.stringify(cfg));else localStorage.removeItem(CFG_KEY)}catch(e){}}
  function set(state,msg){st.state=state;st.msg=msg||"";if(state==="ok")st.at=Date.now();render();}
  var enc=new TextEncoder(),dec=new TextDecoder();
  function b64(buf){var b=new Uint8Array(buf),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
  function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  async function key(pass,salt){var k=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
  async function seal(obj){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},await key(cfg.pass,salt),enc.encode(JSON.stringify(obj)));
    return JSON.stringify({app:"daftar-sarmayeh",v:1,salt:b64(salt),iv:b64(iv),ct:b64(ct)});}
  async function open(text){var o=JSON.parse(text);
    try{var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},await key(cfg.pass,unb64(o.salt)),unb64(o.ct));}
    catch(e){var err=new Error("pass");err.code="pass";throw err;}
    return JSON.parse(dec.decode(pt));}
  async function gh(path,opt){
    opt=opt||{};var r;
    try{r=await fetch(API+path,{method:opt.method||"GET",headers:{"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:opt.body?JSON.stringify(opt.body):undefined,cache:"no-store"});}
    catch(e){var n=new Error("net");n.code="net";throw n;}
    if(r.status===401||r.status===403){var a=new Error("auth");a.code="auth";throw a;}
    if(!r.ok){var x=new Error("http "+r.status);x.code="http";throw x;}
    return r.status===204?null:r.json();
  }
  async function readGist(id){var g=await gh("/gists/"+id);var f=g.files&&g.files[FILE];if(!f)return null;
    var text=f.truncated?await (await fetch(f.raw_url,{cache:"no-store"})).text():f.content;return open(text);}
  async function findGist(){var page=1;while(page<=5){var list=await gh("/gists?per_page=100&page="+page);if(!list.length)return null;
    for(var i=0;i<list.length;i++)if(list[i].files&&list[i].files[FILE])return list[i].id;page++;}return null;}
  function merge(remote){
    var changedLocal=false,changedRemote=false,ri=(remote&&remote.items)||{};
    Object.keys(ri).forEach(function(id){var r=ri[id],l=S.items[id];
      if(!l||(+r.updatedAt||0)>(+l.updatedAt||0)){S.items[id]=r;changedLocal=true;}});
    Object.keys(S.items).forEach(function(id){var r=ri[id],l=S.items[id];if(!r||(+l.updatedAt||0)>(+r.updatedAt||0))changedRemote=true;});
    var rs=(remote&&remote.settings)||null;
    if(rs&&(+rs.updatedAt||0)>(+S.settings.updatedAt||0)){S.settings=Object.assign({remindDays:3},rs);changedLocal=true;}
    else if(!rs||(+S.settings.updatedAt||0)>(+rs.updatedAt||0))changedRemote=true;
    return {local:changedLocal,remote:changedRemote};
  }
  async function run(){
    if(!cfg)return;
    if(busy){again=true;return;}
    busy=true;set("syncing");
    try{
      if(!cfg.gist){cfg.gist=await findGist();saveCfg();}
      var remote=cfg.gist?await readGist(cfg.gist):null;
      var m=merge(remote);
      if(m.local){localSave();}
      if(m.remote||!cfg.gist){
        var body={description:"دفتر سرمایه (رمزنگاری‌شده)",files:{}};body.files[FILE]={content:await seal({items:S.items,settings:S.settings,at:Date.now()})};
        if(cfg.gist)await gh("/gists/"+cfg.gist,{method:"PATCH",body:body});
        else{body.public=false;var g=await gh("/gists",{method:"POST",body:body});cfg.gist=g.id;saveCfg();}
      }
      set("ok");
    }catch(e){
      if(e.code==="pass")set("error","رمز با رمزِ دستگاه‌های دیگه یکی نیست.");
      else if(e.code==="auth")set("error","توکن GitHub درست نیست یا دسترسی gist نداره.");
      else if(e.code==="net")set("offline","اینترنت وصل نیست. بعداً خودش همگام می‌شه.");
      else set("error","همگام‌سازی نشد. دوباره امتحان کن.");
    }finally{busy=false;if(again){again=false;soon();}}
  }
  function soon(){if(!cfg)return;clearTimeout(timer);timer=setTimeout(run,1500);}
  function start(){if(cfg)run();
    document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")run();});
    window.addEventListener("online",function(){run();});
    setInterval(function(){if(document.visibilityState==="visible")run();},120000);}
  async function connect(token,pass){
    if(!window.crypto||!crypto.subtle){toast("همگام‌سازی فقط وقتی کار می‌کنه که صفحه از یه لینک https (مثل GitHub Pages) باز شده باشه.");return;}
    cfg={token:token,pass:pass,gist:null};
    try{await gh("/gists?per_page=1");}catch(e){cfg=null;set("off");toast(e.code==="net"?"به GitHub وصل نشد. اینترنت رو چک کن.":"توکن GitHub درست نیست یا دسترسی gist نداره.");return;}
    saveCfg();await run();if(st.state==="error"&&st.msg.indexOf("رمز")===0){cfg=null;saveCfg();toast("رمز با رمزی که روی دستگاه دیگه زدی یکی نیست.");set("off");}
    else if(st.state==="ok")toast("وصل شد. از این به بعد خودش همگام می‌شه.");
  }
  function disconnect(){cfg=null;saveCfg();set("off");toast("همگام‌سازی روی این دستگاه خاموش شد. اطلاعات روی دستگاه می‌مونه.");}
  return {start:start,soon:soon,run:run,connect:connect,disconnect:disconnect,status:function(){return st},on:function(){return !!cfg}};
})();

/* ---------- derived numbers ---------- */
function all(kind){return live().filter(function(i){return i.kind===kind})}
function totals(){
  var assets=all("asset").reduce(function(s,a){return s+(+a.value||0)},0);
  var cheques=all("cheque");
  var chIn=cheques.filter(function(c){return c.dir==="in"&&c.status!=="passed"}).reduce(function(s,c){return s+(+c.amount||0)},0);
  var chOut=cheques.filter(function(c){return c.dir==="out"&&c.status!=="passed"}).reduce(function(s,c){return s+(+c.amount||0)},0);
  var loans=all("loan");
  var owed=loans.filter(function(l){return l.dir==="owed"}).reduce(function(s,l){return s+(+l.amount||0)},0);
  var owe=loans.filter(function(l){return l.dir==="owe"}).reduce(function(s,l){return s+(+l.amount||0)},0);
  var recv=chIn+owed,pay=chOut+owe;
  return {assets:assets,recv:recv,pay:pay,net:assets+recv-pay};
}
function pendingCheques(){return all("cheque").filter(function(c){return c.status==="pending"}).sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:0})}

/* ---------- render ---------- */
var app=document.getElementById("app");
function render(){
  renderTabs();
  if(S.mode==="loading"){app.innerHTML=header()+'<div class="card empty"><b>در حال باز کردن دفتر…</b><span>اطلاعاتت از حافظه‌ی گوشی خونده می‌شه.</span></div>';return;}
  var v=S.tab==="cheques"?viewCheques():S.tab==="assets"?viewAssets():S.tab==="loans"?viewLoans():viewHome();
  app.innerHTML=header()+v;
}
function header(){
  var ss=Sync.status(),pill;
  if(!Sync.on())pill='<span class="store-pill">فقط روی همین دستگاه</span>';
  else if(ss.state==="syncing")pill='<span class="store-pill">در حال همگام‌سازی…</span>';
  else if(ss.state==="ok")pill='<span class="store-pill good">همگام ✓ '+fa(new Date(ss.at).getHours())+':'+fa(pad(new Date(ss.at).getMinutes()))+'</span>';
  else pill='<button class="store-pill warn" data-tab="assets">'+(ss.state==="offline"?"آفلاین":"خطای همگام‌سازی")+'</button>';
  var j=jFromIso(todayIso());
  return '<header class="top"><div class="brand"><b>دفتر سرمایه</b><span>امروز '+fa(j[2])+" "+MONTHS[j[1]-1]+" "+fa(j[0])+'</span></div>'+pill+'</header>';
}
function hero(){
  var t=totals();
  return '<section class="hero" aria-label="خلاصه">'+
    '<div><div class="lbl">خالص دارایی</div><div class="big num">'+money(t.net)+'<small>تومان</small></div><div class="short">'+esc(shortMoney(t.net))+'</div></div>'+
    '<div class="hero-grid num"><div><span>دارایی‌ها</span><b>'+esc(shortMoney(t.assets))+'</b></div><div><span>طلب و چک دریافتی</span><b>'+esc(shortMoney(t.recv))+'</b></div><div><span>بدهی و چک صادره</span><b>'+esc(shortMoney(t.pay))+'</b></div></div>'+
  '</section>';
}
function dueChip(c){
  if(c.status!=="pending")return '<span class="chip '+STATUS[c.status][1]+'">'+STATUS[c.status][0]+'</span>';
  var d=daysUntil(c.due),r=+S.settings.remindDays||3;
  if(d<0)return '<span class="chip bad">'+fa(-d)+' روز گذشته</span>';
  if(d===0)return '<span class="chip bad">امروز</span>';
  if(d===1)return '<span class="chip warn">فردا</span>';
  if(d<=r)return '<span class="chip warn">'+fa(d)+' روز مانده</span>';
  return '<span class="chip">'+fa(d)+' روز مانده</span>';
}
function chequeRow(c){
  var meta=[faDate(c.due),c.bank,c.number?("شماره "+fa(c.number)):""].filter(Boolean).join(" · ");
  return '<button class="row" data-edit="'+esc(c.id)+'">'+
    '<span class="t"><span class="dir-tag '+(c.dir==="in"?"in":"out")+'">'+(c.dir==="in"?"دریافتی":"صادره")+'</span>'+esc(c.party||"بدون نام")+(c.sample?' <span class="chip brass">نمونه</span>':'')+'</span>'+
    '<span class="amt num '+(c.dir==="in"?"in":"out")+'">'+money(c.amount)+'</span>'+
    '<span class="meta">'+esc(meta)+'</span><span class="side">'+dueChip(c)+'</span></button>';
}
function emptyState(title,body,showSample){
  return '<div class="card empty"><b>'+title+'</b><span>'+body+'</span><div class="btn-row" style="justify-content:center"><button class="btn primary" data-act="add">افزودن</button>'+(showSample?'<button class="btn" data-act="sample">نمایش با داده‌ی نمونه</button>':'')+'</div></div>';
}
function viewHome(){
  var items=live();
  if(!items.length)return hero()+emptyState("دفترت هنوز خالیه","اول چک‌هایی که دستته یا کشیدی رو اضافه کن، بعد دارایی‌ها و بدهی‌ها. هر چیزی ثبت کنی همین‌جا جمع می‌خوره.",true);
  var r=+S.settings.remindDays||3,pend=pendingCheques();
  var urgent=pend.filter(function(c){return daysUntil(c.due)<=r});
  var overdue=urgent.filter(function(c){return daysUntil(c.due)<0}).length;
  var h=hero();
  if(urgent.length){
    var inSum=urgent.filter(function(c){return c.dir==="in"}).reduce(function(s,c){return s+(+c.amount||0)},0);
    var outSum=urgent.filter(function(c){return c.dir==="out"}).reduce(function(s,c){return s+(+c.amount||0)},0);
    var parts=[];if(inSum)parts.push("وصول: "+shortMoney(inSum));if(outSum)parts.push("پرداخت: "+shortMoney(outSum));
    h+='<div class="alert'+(overdue?" bad":"")+'"><i class="dot"></i><div><b>'+fa(urgent.length)+' چک تا '+fa(r)+' روز آینده سررسید داره'+(overdue?' ('+fa(overdue)+' تا گذشته)':'')+'</b><span>'+esc(parts.join(" · "))+'</span></div></div>';
    h+='<section class="section"><div class="section-head"><h2>نیاز به توجه</h2></div><div class="list">'+urgent.map(chequeRow).join("")+'</div></section>';
  }
  var end=addDaysIso(todayIso(),30);
  var month=pend.filter(function(c){return c.due<=end});
  var mi=month.filter(function(c){return c.dir==="in"}).reduce(function(s,c){return s+(+c.amount||0)},0);
  var mo=month.filter(function(c){return c.dir==="out"}).reduce(function(s,c){return s+(+c.amount||0)},0);
  h+='<section class="section"><div class="section-head"><h2>۳۰ روز آینده</h2><span class="sub">'+fa(month.length)+' چک</span></div>'+
     '<div class="flow num"><div class="card"><span>پول ورودی از چک</span><b class="in">'+esc(shortMoney(mi))+'</b></div><div class="card"><span>پول خروجی برای چک</span><b class="out">'+esc(shortMoney(mo))+'</b></div></div>';
  var later=month.filter(function(c){return urgent.indexOf(c)<0});
  if(later.length)h+='<div class="list">'+later.map(chequeRow).join("")+'</div>';
  h+='</section>';
  h+=allocation();
  return h;
}
function allocation(){
  var assets=all("asset");if(!assets.length)return "";
  var by={},tot=0;assets.forEach(function(a){var v=+a.value||0;by[a.type]=(by[a.type]||0)+v;tot+=v;});
  if(tot<=0)return "";
  var keys=ASSET_TYPES.map(function(a){return a[0]}).filter(function(k){return by[k]>0}).sort(function(a,b){return by[b]-by[a]});
  var bar=keys.map(function(k){return '<i style="width:'+(by[k]/tot*100)+'%;background:var('+ASSET_COLOR[k]+')" title="'+esc(ASSET_LABEL[k])+'"></i>'}).join("");
  var leg=keys.map(function(k){return '<div><i style="background:var('+ASSET_COLOR[k]+')"></i>'+esc(ASSET_LABEL[k])+'<span class="num">٪'+fa(Math.round(by[k]/tot*100))+'</span></div>'}).join("");
  return '<section class="section"><div class="section-head"><h2>ترکیب دارایی‌ها</h2><span class="sub num">'+esc(shortMoney(tot))+'</span></div><div class="card alloc"><div class="bar">'+bar+'</div><div class="legend">'+leg+'</div></div></section>';
}
function viewCheques(){
  var f=S.chequeFilter,r=+S.settings.remindDays||3;
  var list=all("cheque").filter(function(c){return f==="all"||c.dir===f});
  var pend=list.filter(function(c){return c.status==="pending"}).sort(function(a,b){return a.due<b.due?-1:1});
  var done=list.filter(function(c){return c.status!=="pending"}).sort(function(a,b){return a.due>b.due?-1:1});
  var opts=[1,2,3,5,7,10].map(function(n){return '<option value="'+n+'"'+(n===r?" selected":"")+'>'+fa(n)+' روز قبل</option>'}).join("");
  var h='<section class="section"><div class="section-head"><h2>چک‌ها</h2>'+
    '<div class="seg" role="group" aria-label="نوع چک">'+[["all","همه"],["in","دریافتی"],["out","صادره"]].map(function(x){return '<button data-filter="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>'}).join("")+'</div></div>';
  h+='<div class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:10px">'+
     '<div class="inline-set"><label for="remind">یادآوری</label><select id="remind">'+opts+'</select><span>و صبح روز سررسید</span></div>'+
     '<div class="btn-row"><button class="btn brass" data-act="ics-all">افزودن همه به تقویم آیفون</button></div>'+
     '<div class="note">تقویم آیفون سر وقت هشدار می‌ده، حتی وقتی این صفحه بسته‌ست. هر وقت چک جدید ثبت کردی، فقط همون رو از داخلش به تقویم اضافه کن.</div></div>';

function dateField(id,label,iso){

function validate(){
  var d=draft;
  if(d.kind==="cheque"&&!d.party)return "نام طرف حساب رو بنویس.";
  if((d.kind==="cheque"||d.kind==="loan")&&!(d.amount>0))return "مبلغ رو وارد کن.";
  if(d.kind==="loan"&&!d.party)return "نام طرف رو بنویس.";
  if(d.kind==="asset"&&!(d.value>0))return "ارزش کل رو وارد کن، یا مقدار و قیمت واحد رو بزن.";
  return null;
}

/* ---------- calendar (.ics) & csv ---------- */
function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function icsEvent(c){
  var ds=c.due.replace(/-/g,""),r=+S.settings.remindDays||3;
  var t=(c.dir==="in"?"وصول چک: ":"پرداخت چک: ")+(c.party||"")+" - "+money(c.amount)+" تومان";
  var desc=[c.dir==="in"?"چک دریافتی":"چک صادره","سررسید "+faDate(c.due),c.bank?("بانک "+c.bank):"",c.number?("شماره "+c.number):"",c.note||""].filter(Boolean).join("\n");
  return ["BEGIN:VEVENT","UID:"+c.id+"@daftar-sarmayeh","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",
    "DTSTART:"+ds+"T090000","DTEND:"+ds+"T093000","SUMMARY:"+icsEsc(t),"DESCRIPTION:"+icsEsc(desc),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(t),"TRIGGER:-P"+r+"D","END:VALARM",
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(t),"TRIGGER:PT0S","END:VALARM","END:VEVENT"].join("\r\n");
}
function icsFile(list){return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//daftar-sarmayeh//fa","CALSCALE:GREGORIAN","METHOD:PUBLISH"].concat(list.map(icsEvent)).concat(["END:VCALENDAR"]).join("\r\n");}
function offerFile(name,data,label,type){
  try{
    var blob=new Blob([data],{type:type||"application/octet-stream"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},4000);toast(label);
  }catch(e){toast("فایل ساخته نشد. دوباره امتحان کن.");}
}
function csv(){
  var rows=[["نوع","جهت/دسته","عنوان یا طرف حساب","مبلغ/ارزش (تومان)","تاریخ (شمسی)","وضعیت","بانک","شماره چک","یادداشت"]];
  live().forEach(function(i){
    if(i.kind==="cheque")rows.push(["چک",i.dir==="in"?"دریافتی":"صادره",i.party,i.amount,faDate(i.due),STATUS[i.status]?STATUS[i.status][0]:"",i.bank,i.number,i.note]);
    else if(i.kind==="asset")rows.push(["دارایی",ASSET_LABEL[i.type],i.name,i.value,"","","","",i.note]);
    else if(i.kind==="loan")rows.push(["طلب/بدهی",i.dir==="owed"?"طلب":"بدهی",i.party,i.amount,i.due?faDate(i.due):"","","","",i.note]);
  });
  return "\ufeff"+rows.map(function(r){return r.map(function(c){c=c==null?"":String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")}).join("\r\n");
}

  if(el.dataset.edit){armedDelete=false;openSheet(null,S.items[el.dataset.edit]);return;}
  if(el.dataset.new){openSheet(el.dataset.new);return;}
  if(el.dataset.dir){collect();draft.dir=el.dataset.dir;drawSheet();return;}
  if(el.dataset.status){collect();draft.status=el.dataset.status;drawSheet();return;}
  if(el.dataset.hasdue){collect();draft.due=el.dataset.hasdue==="1"?(draft.due||todayIso()):null;drawSheet();return;}
  var a=el.dataset.act;
  if(a==="add"){var k=S.tab==="cheques"?"cheque":S.tab==="assets"?"asset":S.tab==="loans"?"loan":null;openSheet(k);return;}
  if(a==="sample"){await addSample();return;}
  if(a==="clear-sample"){await clearSample();return;}
  if(a==="save"){collect();var err=validate();if(err){toast(err);return;}var d=Object.assign({},draft),id=d.id;delete d.id;
    Object.keys(d).forEach(function(k){if(d[k]===undefined)delete d[k]});
    var ok=await saveItem(id,d);if(ok){sheetRoot.innerHTML="";draft=null;toast("ذخیره شد");}return;}
  if(a==="delete"){if(!armedDelete){armedDelete=true;el.classList.add("armed");el.textContent="برای حذف دوباره بزن";return;}
    armedDelete=false;var did=draft.id;sheetRoot.innerHTML="";draft=null;await removeItem(did);toast("حذف شد");return;}
  if(a==="ics-one"){collect();offerFile("cheque-"+draft.due+".ics",icsFile([draft]),"فایل تقویم آماده شد. بازش کن تا به تقویم آیفون اضافه بشه.","text/calendar");return;}
  if(a==="ics-all"){var p=pendingCheques().filter(function(c){return daysUntil(c.due)>=0});if(!p.length){toast("چک در انتظاری برای آینده نیست.");return;}
    offerFile("cheques.ics",icsFile(p),"فایل "+fa(p.length)+" چک آماده شد. بازش کن تا به تقویم اضافه بشه.","text/calendar");return;}
  if(a==="csv"){offerFile("daftar-sarmayeh.csv",csv(),"فایل اکسل آماده شد.","text/csv");return;}
  if(a==="backup"){var d=new Date();offerFile("daftar-backup-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+".json",JSON.stringify({app:"daftar-sarmayeh",v:1,items:S.items,settings:S.settings}),"فایل پشتیبان آماده شد. توی Files یا iCloud نگهش دار.","application/json");return;}
  if(a==="restore"){document.getElementById("restore-file").click();return;}
  if(a==="sync-now"){Sync.run();return;}
  if(a==="sync-off"){Sync.disconnect();return;}
  if(a==="sync-connect"){var tk=document.getElementById("sync-token").value.trim(),ps=document.getElementById("sync-pass").value;
    if(!tk){toast("توکن GitHub رو وارد کن.");return;}if(ps.length<6){toast("رمز حداقل ۶ حرف باشه.");return;}
    el.disabled=true;el.textContent="در حال وصل شدن…";await Sync.connect(tk,ps);return;}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="remind"){S.settings.remindDays=+t.value;saveSettings();render();return;}
  var m=t.id&&t.id.match(/^f-(\w+)-(y|m|d)$/);
  if(m&&draft){var id=m[1];var iso=readDate(id);collect();draft[id]=iso;drawSheet();var el=document.getElementById("f-"+id+"-"+m[2]);if(el)el.focus();}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.money){var n=parseNum(t.value);t.value=n==null?"":money(n);var w=document.getElementById("w-"+t.id.slice(2));if(w)w.textContent=n?shortMoney(n):"";}
  if(draft&&draft.kind==="asset"&&(t.id==="f-qty"||t.id==="f-unitPrice")){
    var q=parseNum((document.getElementById("f-qty").value.match(/[\d۰-۹٠-٩.,٫]+/)||[""])[0]),p=parseNum(document.getElementById("f-unitPrice").value);
    if(q&&p){var v=document.getElementById("f-value");v.value=money(q*p);document.getElementById("w-value").textContent=shortMoney(q*p);}
  }
});
document.getElementById("restore-file").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o||o.app!=="daftar-sarmayeh"||typeof o.items!=="object")throw 0;
    var now=Date.now();Object.keys(S.items).forEach(function(id){S.items[id]={id:id,deleted:true,updatedAt:now}});
    Object.keys(o.items).forEach(function(id){S.items[id]=Object.assign({},o.items[id],{updatedAt:now+1})});
    S.settings=Object.assign({remindDays:3},o.settings||{},{updatedAt:now});localSave();render();Sync.soon();toast("اطلاعات از پشتیبان برگشت ("+fa(Object.values(o.items).filter(function(i){return !i.deleted}).length)+" مورد).");}
    catch(err){toast("این فایل، پشتیبانِ دفتر سرمایه نیست.");}e.target.value="";};
  r.readAsText(f);
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&sheetRoot.innerHTML){sheetRoot.innerHTML="";draft=null;}});

render();
initStore();
})();
</script>
</body>
</html>
